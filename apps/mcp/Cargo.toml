[package]
name = "mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.0"
base64 = "0.23.0"
rand = "0.10.2"
rmcp = { version = "3.1.0", features = ["client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

[dev-dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
rmcp = { version = "3.1.0", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7.19"
