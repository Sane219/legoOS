{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "legoos.componentName" (dict "root" $ "component" "prometheus") }}
  labels:
    {{- include "legoos.labels" (dict "root" $ "component" "prometheus") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.prometheus.persistence.storageClass }}
  storageClassName: {{ .Values.prometheus.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.prometheus.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "legoos.componentName" (dict "root" $ "component" "prometheus") }}
  labels:
    {{- include "legoos.labels" (dict "root" $ "component" "prometheus") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "legoos.selectorLabels" (dict "root" $ "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "legoos.selectorLabels" (dict "root" $ "component" "prometheus") | nindent 8 }}
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- with .Values.prometheus.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "legoos.componentName" (dict "root" $ "component" "prometheus") }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "legoos.componentName" (dict "root" $ "component" "prometheus") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "legoos.componentName" (dict "root" $ "component" "prometheus") }}
  labels:
    {{- include "legoos.labels" (dict "root" $ "component" "prometheus") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "legoos.selectorLabels" (dict "root" $ "component" "prometheus") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.prometheus.service.port }}
      targetPort: http
{{- end }}
