{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "legoos.secretName" . }}
  labels:
    {{- include "legoos.labels" (dict "root" $ "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  MCP_CREDENTIAL_KEY: {{ .Values.secrets.mcpCredentialKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  VOYAGE_API_KEY: {{ .Values.secrets.voyageApiKey | quote }}
{{- end }}
