{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "legoos.componentName" (dict "root" $ "component" "prometheus") }}
  labels:
    {{- include "legoos.labels" (dict "root" $ "component" "prometheus") | nindent 4 }}
data:
  prometheus.yml: |
{{ tpl (.Files.Get "files/prometheus/prometheus.yml") . | indent 4 }}
{{- end }}
