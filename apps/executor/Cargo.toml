[package]
name = "executor"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
llm = { version = "0.1.0", path = "../llm" }
mcp = { version = "0.1.0", path = "../mcp" }
rag = { version = "0.1.0", path = "../rag" }
regex = "1.13.1"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync"] }
uuid = { version = "1.24.0", features = ["serde"] }

[dev-dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
rmcp = { version = "3.1.0", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7.19"
uuid = { version = "1.24.0", features = ["v4"] }
