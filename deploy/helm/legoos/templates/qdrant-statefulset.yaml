apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "legoos.componentName" (dict "root" $ "component" "qdrant") }}
  labels:
    {{- include "legoos.labels" (dict "root" $ "component" "qdrant") | nindent 4 }}
spec:
  serviceName: {{ include "legoos.componentName" (dict "root" $ "component" "qdrant") }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "legoos.selectorLabels" (dict "root" $ "component" "qdrant") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "legoos.selectorLabels" (dict "root" $ "component" "qdrant") | nindent 8 }}
    spec:
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image }}
          ports:
            - containerPort: 6333
              name: rest
            - containerPort: 6334
              name: grpc
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          readinessProbe:
            tcpSocket:
              port: 6334
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6334
            initialDelaySeconds: 15
            periodSeconds: 10
          {{- with .Values.qdrant.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.qdrant.persistence.storageClass }}
        storageClassName: {{ .Values.qdrant.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.qdrant.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "legoos.componentName" (dict "root" $ "component" "qdrant") }}
  labels:
    {{- include "legoos.labels" (dict "root" $ "component" "qdrant") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "legoos.selectorLabels" (dict "root" $ "component" "qdrant") | nindent 4 }}
  ports:
    - name: rest
      port: {{ .Values.qdrant.service.restPort }}
      targetPort: 6333
    - name: grpc
      port: {{ .Values.qdrant.service.grpcPort }}
      targetPort: 6334
