[package]
name = "worker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
executor = { version = "0.1.0", path = "../executor" }
llm = { version = "0.1.0", path = "../llm" }
mcp = { version = "0.1.0", path = "../mcp" }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
queue = { version = "0.1.0", path = "../queue" }
rag = { version = "0.1.0", path = "../rag" }
redis = { version = "1.5.0", features = ["tokio-comp", "streams", "connection-manager"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "uuid", "chrono", "json", "migrate"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
axum = "0.8.9"
rmcp = { version = "3.1.0", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio-util = "0.7.19"
