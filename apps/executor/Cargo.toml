[package]
name = "executor"
version = "0.1.0"
edition = "2024"

[dependencies]
llm = { version = "0.1.0", path = "../llm" }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync"] }
uuid = { version = "1.24.0", features = ["serde"] }

[dev-dependencies]
async-trait = "0.1.89"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.24.0", features = ["v4"] }
