[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
queue = { version = "0.1.0", path = "../queue" }
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "uuid", "chrono", "migrate", "json"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
redis = { version = "1.5.0", features = ["tokio-comp", "streams", "connection-manager"] }
futures-util = "0.3.33"
url = "2.5.8"
mcp = { version = "0.1.0", path = "../mcp" }
rag = { version = "0.1.0", path = "../rag" }
llm = { version = "0.1.0", path = "../llm" }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"

[dev-dependencies]
async-trait = "0.1.91"
http-body-util = "0.1.4"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
worker = { path = "../worker" }
