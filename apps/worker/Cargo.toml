[package]
name = "worker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
executor = { version = "0.1.0", path = "../executor" }
llm = { version = "0.1.0", path = "../llm" }
queue = { version = "0.1.0", path = "../queue" }
redis = { version = "1.5.0", features = ["tokio-comp", "streams", "connection-manager"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "uuid", "chrono", "json"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
