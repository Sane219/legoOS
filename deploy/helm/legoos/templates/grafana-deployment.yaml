{{- if .Values.grafana.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "legoos.componentName" (dict "root" $ "component" "grafana") }}
  labels:
    {{- include "legoos.labels" (dict "root" $ "component" "grafana") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "legoos.selectorLabels" (dict "root" $ "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "legoos.selectorLabels" (dict "root" $ "component" "grafana") | nindent 8 }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: {{ .Values.grafana.anonymousAuth | quote }}
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: provisioning
              mountPath: /var/lib/grafana/dashboards/legoos-overview.json
              subPath: legoos-overview.json
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- with .Values.grafana.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: provisioning
          configMap:
            name: {{ include "legoos.componentName" (dict "root" $ "component" "grafana") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "legoos.componentName" (dict "root" $ "component" "grafana") }}
  labels:
    {{- include "legoos.labels" (dict "root" $ "component" "grafana") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "legoos.selectorLabels" (dict "root" $ "component" "grafana") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.grafana.service.port }}
      targetPort: http
{{- end }}
