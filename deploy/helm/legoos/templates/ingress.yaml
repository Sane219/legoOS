{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "legoos.fullname" . }}
  labels:
    {{- include "legoos.labels" (dict "root" $ "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.web.host }}
      http:
        paths:
          - path: {{ .Values.ingress.web.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "legoos.componentName" (dict "root" $ "component" "web") }}
                port:
                  number: {{ .Values.web.service.port }}
    - host: {{ .Values.ingress.api.host }}
      http:
        paths:
          - path: {{ .Values.ingress.api.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "legoos.componentName" (dict "root" $ "component" "api") }}
                port:
                  number: {{ .Values.api.service.port }}
{{- end }}
