apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "legoos.componentName" (dict "root" $ "component" "postgres") }}
  labels:
    {{- include "legoos.labels" (dict "root" $ "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ include "legoos.componentName" (dict "root" $ "component" "postgres") }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "legoos.selectorLabels" (dict "root" $ "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "legoos.selectorLabels" (dict "root" $ "component" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.auth.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 15
            periodSeconds: 10
          {{- with .Values.postgres.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.persistence.storageClass }}
        storageClassName: {{ .Values.postgres.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "legoos.componentName" (dict "root" $ "component" "postgres") }}
  labels:
    {{- include "legoos.labels" (dict "root" $ "component" "postgres") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "legoos.selectorLabels" (dict "root" $ "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: 5432
